  <style>
    :root {
      --green: #00FF41;
      --black: #030303;
      --card: #111111;
      --border: #1E1E1E;
      --white: #F5F5F5;
      --muted: #8A938A;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--black);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .photo {
      width: 136px;
      height: 136px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      outline: 2px solid var(--green);
      outline-offset: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }
    /* Cuando esté la foto real: sustituir el span por
       <img src="/germangonzalez/foto.webp" alt="Germán González"> */
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo span {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 56px;
      letter-spacing: 2px;
      color: var(--green);
      line-height: 1;
      padding-top: 6px;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(52px, 15vw, 68px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: 1px;
    }
    .role {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--green);
      margin-top: 14px;
    }
    .bio {
      font-size: 16px;
      line-height: 1.55;
      color: var(--muted);
      max-width: 32ch;
      margin-top: 14px;
    }

    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 32px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 17px 24px;
      border-radius: 999px;
      font-family: 'DM Sans', sans-serif;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--green); color: var(--black); }
    .btn-secondary {
      background: var(--card);
      color: var(--white);
      border: 1px solid var(--border);
    }
    .btn svg { flex-shrink: 0; }

    .footer {
      margin-top: 36px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .footer img { width: 22px; height: 22px; display: block; }
    .footer a {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--muted);
      text-decoration: none;
    }
    .footer a:hover { color: var(--white); }

    @media (prefers-reduced-motion: no-preference) {
      .reveal {
        opacity: 0;
        transform: translateY(16px);
        animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .reveal:nth-child(2) { animation-delay: 0.08s; }
      .reveal:nth-child(3) { animation-delay: 0.16s; }
      .reveal:nth-child(4) { animation-delay: 0.24s; }
      .reveal:nth-child(5) { animation-delay: 0.32s; }
      .reveal:nth-child(6) { animation-delay: 0.4s; }
      @keyframes rise {
        to { opacity: 1; transform: translateY(0); }
      }
      .btn:hover { transform: translateY(-1px); }
      .btn:active { transform: scale(0.98); }
    }
  </style>
